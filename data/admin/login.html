<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>دخول لوحة التحكم — الفرات الحلوة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--abyss:#073B57;--river:#1478A0;--clear:#2FB6D8;--aqua:#47D6D2;--gold:#E8A33D;--honey:#F5C86B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
  background:radial-gradient(120% 130% at 80% 0%,#0E5E82,#0A4665 32%,#073B57 62%,#052A40);color:#fff;padding:20px;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent)}
.card{position:relative;width:min(400px,100%);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);border-radius:26px;padding:34px 30px;backdrop-filter:blur(16px);box-shadow:0 34px 80px -28px rgba(0,0,0,.75);text-align:center}
img{width:92px;height:92px;margin:0 auto 12px;border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{font-family:'Cairo',sans-serif;font-size:1.5rem;margin:0 0 4px}
p{color:#B9D8E6;font-size:.9rem;margin:0 0 24px}
label{display:block;text-align:start;font-size:.85rem;font-weight:700;color:#CFE6F1;margin-bottom:7px}
input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:1.25rem;text-align:center;letter-spacing:.5em;font-family:inherit}
input::placeholder{letter-spacing:normal;font-size:.95rem;color:rgba(255,255,255,.45)}
input:focus{outline:0;border-color:var(--aqua);box-shadow:0 0 0 4px rgba(71,214,210,.2)}
button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:800;font-size:1.05rem;color:#3A2607;background:linear-gradient(135deg,var(--honey),var(--gold));box-shadow:0 14px 30px -12px rgba(232,163,61,.9);transition:.22s}
button:hover{transform:translateY(-2px);filter:saturate(1.1)}
button:disabled{opacity:.6;cursor:wait;transform:none}
.err{background:rgba(224,91,76,.2);border:1px solid rgba(224,91,76,.5);color:#FFC9C1;padding:10px;border-radius:12px;font-size:.88rem;margin-bottom:16px;display:none}
.err.on{display:block}
.note{margin-top:20px;font-size:.78rem;color:#8FB3C6}
a{color:var(--honey)}
</style>
</head>
<body>
<div class="bg"></div>
<form class="card" id="loginForm" autocomplete="off">
  <img src="/assets/logo/logo-symbol.png" alt="">
  <h1>لوحة تحكم الفرات الحلوة</h1>
  <div class="err" id="errBox">رمز الدخول غير صحيح — تأكد منه وجرب مرة ثانية</div>
  <label for="pin">رمز الدخول</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" placeholder="••••" autofocus required>
  <button type="submit" id="btn">دخول</button>
  <p class="note"><a href="/">← رجوع للموقع</a></p>
</form>
<script>
(function(){
  var f = document.getElementById('loginForm');
  var inp = document.getElementById('pin');
  var err = document.getElementById('errBox');
  var btn = document.getElementById('btn');


  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.classList.remove('on');
    btn.disabled = true; btn.textContent = 'جاري الدخول…';
    fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: inp.value.trim() })
    })
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
    .then(function(res){
      if (res.ok && res.j.token) {
        try{localStorage.setItem('fh_token',res.j.token);}catch(e){}
        location.href = '/admin?tok=' + encodeURIComponent(res.j.token);
      } else {
        err.classList.add('on');
        inp.value = ''; inp.focus();
        btn.disabled = false; btn.textContent = 'دخول';
      }
    })
    .catch(function(){
      err.textContent = 'صار خطأ بالاتصال — تأكد إن السيرفر شغال وجرب مرة ثانية';
      err.classList.add('on');
      btn.disabled = false; btn.textContent = 'دخول';
    });
  });
})();
</script>
</body>
</html>
